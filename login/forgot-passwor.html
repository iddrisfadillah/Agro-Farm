<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password · AgroMarket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

<header class="marketing-nav plain">
  <a href="login.html" class="marketing-brand">
    <div class="brand-mark sm"><i class="fa-solid fa-seedling"></i></div>
    <span>AgroMarket</span>
  </a>
  <nav class="marketing-links auth-nav-links">
    <a href="login.html">Sign In</a>
    <a href="signup.html">Join Now</a>
  </nav>
</header>

<div class="centered-auth">
  <div class="reset-card">
    <div class="reset-icon"><i class="fa-solid fa-key"></i></div>
    <h2>Reset Password</h2>
    <p class="auth-sub center">Enter your phone number. We’ll send an OTP so you can reset your password.</p>

    <form id="reset-form">
    <!-- Step 1: Phone -->
    <div id="step-phone">
    <div class="field">
      <label for="reset-phone">Phone Number</label>
      <div class="input-icon">
        <i class="fa-solid fa-phone"></i>
        <input type="tel" id="reset-phone" placeholder="e.g. 0244123456" maxlength="10" required>
      </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="send-otp-btn">
      Send OTP <i class="fa-solid fa-arrow-right"></i>
      </button>
      </div>

     <!-- Step 2: OTP + New Password (hidden at first) -->
      <div id="step-reset" style="display:none;">
      <div class="field">
      <label for="reset-otp">OTP Code</label>
      <div class="input-icon">
        <i class="fa-solid fa-shield"></i>
        <input type="text" id="reset-otp" placeholder="6-digit OTP" maxlength="6" required>
        </div>
      </div>
      <div class="field">
      <label for="reset-password">New Password</label>
      <div class="input-icon">
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="reset-password" placeholder="Min 6 characters" required>
      </div>
      </div>
      <div class="field">
      <label for="reset-password-confirm">Confirm Password</label>
      <div class="input-icon">
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="reset-password-confirm" placeholder="Confirm new password" required>
      </div>
      </div>
      <button type="button" class="btn btn-primary btn-block" id="reset-password-btn">
      Reset Password <i class="fa-solid fa-check"></i>
    </button>
    </div>
    </form>

    <a href="login.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Login</a>
  </div>
</div>

<footer class="marketing-footer">
  <div class="marketing-brand">
    <div class="brand-mark sm"><i class="fa-solid fa-seedling"></i></div>
    <span>AgroMarket</span>
  </div>
  <nav class="footer-links">
    <a href="#">Privacy Policy</a>
    <a href="#">Terms of Service</a>
    <a href="#">Help Center</a>
    <a href="#">Cookie Settings</a>
  </nav>
  <span class="text-muted">© 2026 AgroMarket Inc. All rights reserved.</span>
</footer>

<div class="toast" id="toast">
  <i class="fa-solid fa-circle-check"></i>
  <span id="toast-text">Reset link sent</span>
</div>

<script src="script.js"></script>
</body>
</html>
