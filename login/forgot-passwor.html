<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password · AgroMarket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

<header class="marketing-nav plain">
  <a href="login.html" class="marketing-brand">
    <div class="brand-mark sm"><i class="fa-solid fa-seedling"></i></div>
    <span>AgroMarket</span>
  </a>
  <nav class="marketing-links auth-nav-links">
    <a href="login.html">Sign In</a>
    <a href="signup.html">Join Now</a>
  </nav>
</header>

<div class="centered-auth">
  <div class="reset-card">
    <div class="reset-icon"><i class="fa-solid fa-key"></i></div>
    <h2>Reset Password</h2>
    <p class="auth-sub center">Enter the email address associated with your account and we'll send you a link to reset your password.</p>

    <form id="reset-form">
      <div class="field">
        <label for="reset-email">Email Address</label>
        <div class="input-icon">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" id="reset-email" placeholder="farmer@agromarket.com" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Send Reset Link <i class="fa-solid fa-arrow-right"></i></button>
    </form>

    <a href="login.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Login</a>
  </div>
</div>

<footer class="marketing-footer">
  <div class="marketing-brand">
    <div class="brand-mark sm"><i class="fa-solid fa-seedling"></i></div>
    <span>AgroMarket</span>
  </div>
  <nav class="footer-links">
    <a href="#">Privacy Policy</a>
    <a href="#">Terms of Service</a>
    <a href="#">Help Center</a>
    <a href="#">Cookie Settings</a>
  </nav>
  <span class="text-muted">© 2026 AgroMarket Inc. All rights reserved.</span>
</footer>

<div class="toast" id="toast">
  <i class="fa-solid fa-circle-check"></i>
  <span id="toast-text">Reset link sent</span>
</div>

<script src="script.js"></script>
</body>
</html>
